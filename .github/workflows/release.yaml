name: Release demo-app

on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"

env:
    REGISTRY: ghcr.io

jobs:
    build-and-package:
        permissions:
            contents: read
            packages: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                  java-version: "21"
                  distribution: "temurin"
                  server-id: "installr-io-maven-repo"

            - name: Log into registry ${{ env.REGISTRY }}
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.PA_TOKEN }}

            - name: Build
              env:
                  GITHUB_TOKEN: ${{ secrets.PA_TOKEN }}
              run: | 
                mvn -B clean verify -Dquarkus.container-image.build=true \
                    -Dquarkus.container-image.push=true ipf:package

            - name: Upload IPF
              uses: actions/upload-artifact@v6
              with:
                  name: demo-app-ipf
                  path: target/demo-app-*.ipf
                  if-no-files-found: error
                  overwrite: true

    create-release:
        needs: build-and-package
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            - name: Download IPF
              uses: actions/download-artifact@v8
              with:
                  name: demo-app-ipf

            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  tag: ${{ github.ref_name }}
              run: |
                gh release create \
                    --repo="$GITHUB_REPOSITORY" \
                    --title="${tag}" \
                    --generate-notes \
                    --fail-on-no-commits \
                    --verify-tag \
                    "$tag" ./demo-app-*.ipf
